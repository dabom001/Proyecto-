<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Emotion Detector</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        #system_response {
            margin-top: 25px;
            padding: 20px;
            background-color: #f1f1f1;
            border-radius: 8px;
            line-height: 1.7;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Emotion Detector</h1>

        <p>
            Enter a sentence and Watson NLP will detect
            the emotions expressed.
        </p>

        <textarea
            id="textToAnalyze"
            placeholder="Example: I am really happy today!"
        ></textarea>

        <button onclick="runEmotionDetection()">
            Detect Emotion
        </button>

        <div id="system_response">
            Results will appear here.
        </div>

    </div>

    <script>

        async function runEmotionDetection() {

            const text =
                document.getElementById(
                    "textToAnalyze"
                ).value;

            const responseElement =
                document.getElementById(
                    "system_response"
                );

            if (!text.trim()) {

                responseElement.innerHTML =
                    "<strong>Invalid text! Please try again!</strong>";

                return;
            }

            try {

                const response =
                    await fetch(
                        "/emotionDetector?textToAnalyze="
                        + encodeURIComponent(text)
                    );

                const data = await response.text();

                responseElement.innerHTML =
                    "<pre>" + data + "</pre>";

            } catch (error) {

                responseElement.innerHTML =
                    "Error connecting to the server.";

            }
        }

    </script>

</body>

</html>
